version: '3.8'

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: nexora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nexora_root
      MYSQL_DATABASE: nexora
      MYSQL_USER: nexora_user
      MYSQL_PASSWORD: nexora_pass
    ports:
      - "3307:3306"
    volumes:
      - nexora_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  nexora_mysql_data:
