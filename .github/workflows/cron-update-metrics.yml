name: Cron — Actualizar métricas

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cron-invoke
        with:
          api-url: ${{ secrets.NEXORA_API_URL }}
          cron-secret: ${{ secrets.CRON_SECRET }}
          path: '/api/internal/cron/update-metrics?modo=ejecutar'
